# La Lista — self-hosted stack.
#
#   postgres          durable storage for the Convex backend
#   convex-backend    Convex OSS backend (queries, mutations, actions, crons,
#                     HTTP actions) — the reactive layer the app depends on
#   convex-dashboard  admin UI (profile "dashboard")
#   convex-deploy     one-shot: pushes convex/ functions + env vars (profile "setup")
#   web               the Next.js app
#
# See DEPLOYMENT.md. Configuration lives in .env (copy .env.selfhost.example).

name: la-lista

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Must match INSTANCE_NAME with dashes replaced by underscores.
      POSTGRES_DB: convex_self_hosted
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convex} -d convex_self_hosted"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    environment:
      INSTANCE_NAME: convex-self-hosted
      # Pinning this keeps admin keys valid even if the data volume is lost.
      # Left empty, the backend generates one and persists it to the volume.
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-}
      # Connection string WITHOUT the database name — the backend appends it.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-convex}:${POSTGRES_PASSWORD}@postgres:5432
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL:-1}
      # Public origins, as the browser and the Chrome extension reach them.
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DISABLE_BEACON: ${DISABLE_BEACON:-1}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - convex-data:/convex/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3210/version || exit 1"]
      interval: 5s
      start_period: 15s
      retries: 20

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_BACKEND_VERSION:-latest}
    profiles: ["dashboard"]
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    depends_on:
      convex-backend:
        condition: service_healthy

  # One-shot. Pushes convex/ functions and backend env vars, then exits.
  # Run with: docker compose --profile setup run --rm convex-deploy
  convex-deploy:
    build:
      context: .
      target: tools
    profiles: ["setup"]
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:?run ./scripts/selfhost.sh admin-key first}
      # Written onto the deployment by scripts/selfhost.sh push-env.
      CLERK_JWT_ISSUER_DOMAIN: ${CLERK_JWT_ISSUER_DOMAIN:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      ADMIN_ALLOWLIST_EMAILS: ${ADMIN_ALLOWLIST_EMAILS:-}
    volumes:
      # So `convex export` snapshots land on the host, not in a container
      # that is deleted the moment the command finishes.
      - ./backups:/backups
    depends_on:
      convex-backend:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Server-side reads. NEXT_PUBLIC_* are already inlined at build time;
      # NEXT_PUBLIC_CONVEX_URL is repeated because server components read it too.
      NEXT_PUBLIC_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    depends_on:
      convex-backend:
        condition: service_healthy

volumes:
  postgres-data:
  convex-data:
